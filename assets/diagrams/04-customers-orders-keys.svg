<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600"><rect width="980" height="600" fill="#0d1825"/><style>.t{font:700 20px Arial;fill:#fff}.c{font:14px Arial;fill:#b9d4df}.k{font:700 13px monospace;fill:#69d6c0}.b{fill:#132a3d;stroke:#69d6c0;stroke-width:2}.a{stroke:#f2a65a;stroke-width:3;fill:none}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2a65a"/></marker></defs><text x="490" y="42" text-anchor="middle" class="t">Khoá chính và khoá ngoại trong cửa hàng</text><g transform="translate(55 85)"><rect class="b" width="250" height="170" rx="12"/><text x="20" y="35" class="t">customers</text><text x="20" y="70" class="k">PK customer_id</text><text x="20" y="100" class="c">UNIQUE email</text><text x="20" y="130" class="c">full_name</text></g><g transform="translate(365 85)"><rect class="b" width="250" height="170" rx="12"/><text x="20" y="35" class="t">orders</text><text x="20" y="70" class="k">PK order_id</text><text x="20" y="100" class="k">FK customer_id</text><text x="20" y="130" class="c">status · ordered_at</text></g><g transform="translate(675 85)"><rect class="b" width="250" height="170" rx="12"/><text x="20" y="35" class="t">products</text><text x="20" y="70" class="k">PK product_id</text><text x="20" y="100" class="c">UNIQUE sku</text><text x="20" y="130" class="c">price_cents</text></g><g transform="translate(365 355)"><rect class="b" width="300" height="185" rx="12"/><text x="20" y="35" class="t">order_items</text><text x="20" y="72" class="k">PK (order_id, product_id)</text><text x="20" y="105" class="k">FK order_id → orders</text><text x="20" y="138" class="k">FK product_id → products</text><text x="20" y="165" class="c">quantity · unit_price_cents</text></g><path class="a" marker-end="url(#m)" d="M365 170H305"/><path class="a" marker-end="url(#m)" d="M455 355V255"/><path class="a" marker-end="url(#m)" d="M620 390Q770 340 800 255"/><text x="335" y="155" class="c">N orders : 1 customer</text><text x="690" y="330" class="c">FK bảo vệ referential integrity</text></svg>